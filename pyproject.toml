[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tnmsc-scraper"
version = "0.1.0"
description = "Polite scraper for the public lists of tnmsc.tn.gov.in (Tamil Nadu Medical Services Corporation)"
license = { text = "MIT" }
authors = [{ name = "Trideep" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "certifi"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tnmsc-scraper = "tnmsc_scraper.cli:main"

[tool.setuptools]
packages = ["tnmsc_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
